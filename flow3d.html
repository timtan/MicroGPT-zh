<style>
  /* touch-action: none 讓 iOS Safari 不要把垂直滑動吃成橡皮筋捲動,手勢才收得到 */
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; touch-action: none;
               font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #intro { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 18px; color: #dbe6ff; background: radial-gradient(ellipse at 50% 40%, rgba(20,30,60,.55), rgba(5,7,15,.92));
           z-index: 20; transition: opacity .6s; cursor: pointer; }
  #intro.hidden { opacity: 0; pointer-events: none; }
  #intro h1 { font-size: 40px; font-weight: 700; margin: 0; letter-spacing: 2px;
              background: linear-gradient(90deg, #7dd3fc, #c4b5fd, #fda4af); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #intro p  { margin: 0; font-size: 17px; color: #93a4c8; }
  #intro .keys { font-size: 14px; color: #64748b; margin-top: 10px; line-height: 1.9; text-align: center; }
  #intro .keys b { color: #cbd5f5; font-weight: 600; }

  #info { position: fixed; left: 22px; bottom: 22px; max-width: 520px; z-index: 10;
          background: rgba(8, 12, 26, .78); border: 1px solid rgba(120, 150, 220, .25);
          border-radius: 14px; padding: 14px 18px; color: #dbe6ff; backdrop-filter: blur(6px);
          transition: opacity .4s, transform .4s; }
  #info.hidden { opacity: 0; transform: translateY(12px); }
  #info .t { font-size: 19px; font-weight: 700; color: #e2ecff; }
  #info .t small { font-weight: 400; color: #6b7ba3; margin-left: 8px; font-size: 12px; }
  #info .d { font-size: 14px; color: #9fb0d6; margin-top: 5px; line-height: 1.65; }
  #info .c { margin-top: 8px; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
             color: #8ef0d2; background: rgba(10, 25, 22, .6); border-left: 3px solid #2dd4a7;
             padding: 6px 10px; border-radius: 6px; white-space: pre; overflow-x: auto; }

  #progress { position: fixed; right: 22px; bottom: 22px; z-index: 10; color: #8093bd; font-size: 13px;
              background: rgba(8, 12, 26, .7); border: 1px solid rgba(120, 150, 220, .2);
              border-radius: 999px; padding: 7px 16px; }
  #progress b { color: #dbe6ff; }
  #fastfwd { position: fixed; right: 22px; bottom: 62px; z-index: 10; color: #fbbf24; font-size: 12px;
             opacity: 0; transition: opacity .2s; }
  #fastfwd.on { opacity: 1; }

  /* 盲測:多批聽眾都說「字太小,我根本沒去讀」,還因此把藍=正值/黃=負值理解反了 → 放大 */
  /* 放左上:右上會壓到 KV Cache 記憶櫃(第 9–12 關記憶櫃就在右上角) */
  #legend { position: fixed; left: 22px; top: 18px; z-index: 10; display: none;
            background: rgba(8, 12, 26, .82); border: 1px solid rgba(120, 150, 220, .3);
            border-radius: 10px; padding: 9px 16px; color: #b3c4e6; font-size: 15px; line-height: 1.6; }
  #legend .sw { display: inline-block; width: 13px; height: 13px; border-radius: 3px;
                vertical-align: -2px; margin: 0 5px 0 12px; }

  /* 觸控裝置(手機 / iPad)看手勢說明,滑鼠鍵盤裝置看快捷鍵;用 pointer 而非寬度判斷,
     因為 iPad 橫向寬度遠大於 640px,但一樣沒有鍵盤 */
  .k-touch { display: none; }
  @media (hover: none) and (pointer: coarse) {
    .k-desktop { display: none; }
    .k-touch { display: block; }
  }

  @media (max-width: 640px) {
    #intro h1 { font-size: 26px; letter-spacing: 1px; }
    #intro p  { font-size: 14px; padding: 0 20px; }
    #intro .keys { font-size: 12px; }

    #info { left: 10px; right: 10px; bottom: 10px; max-width: none;
            padding: 10px 12px; border-radius: 10px; }
    #info .t { font-size: 15px; }
    #info .t small { display: block; margin-left: 0; margin-top: 2px; }
    #info .d { font-size: 12px; line-height: 1.5; margin-top: 4px; }
    #info .c { font-size: 10.5px; padding: 5px 8px; }

    #progress { right: 10px; bottom: auto; top: 10px; font-size: 11px; padding: 5px 12px; }
    #fastfwd { right: 10px; bottom: auto; top: 42px; font-size: 11px; }
    /* 手機也要有圖例(顏色語言是看懂方塊的前提);兩行各自不折行,否則「只是/搬運」會斷成兩截 */
    #legend { left: 10px; right: 10px; top: 10px;
              font-size: 10px; line-height: 1.6; padding: 6px 8px; }
    #legend > div { white-space: nowrap; }
    #legend .sw { width: 9px; height: 9px; margin: 0 3px 0 6px; }
  }
</style>

<body>
<div id="app"></div>

<div id="intro">
  <h1>從字母到抽樣:一顆方塊的旅程</h1>
  <p>MicroGPT 前向傳播 3D 視覺化 — 16 維、4 頭、1 層、4192 個參數<br>
  整條路上只有 7 個地方用到訓練出來的參數(金色光環),其餘全是固定的算術或搬運。</p>
  <div class="keys">
    <div class="k-desktop">
      <b>空白鍵 / 點擊</b> 推進下一關(播放中再按 = 快轉)<br>
      <b>←</b> 回上一關定格 &nbsp; <b>R</b> 重來 &nbsp; <b>F</b> 全螢幕<br><br>
      點擊任意處開始
    </div>
    <div class="k-touch">
      <b>往上撥</b> 推進下一關 &nbsp; <b>往下拉</b> 回上一關定格<br>
      輕點畫面也可推進(播放中再點 = 快轉)<br><br>
      點一下任意處開始
    </div>
  </div>
</div>

<div id="info" class="hidden">
  <div class="t"><span id="info-title"></span><small id="info-sub"></small></div>
  <div class="d" id="info-desc"></div>
  <div class="c" id="info-code"></div>
</div>
<div id="progress">按 <b>空白鍵</b> 開始 · 0 / 21</div>
<div id="fastfwd">⏩ 快轉中</div>
<div id="legend">
  <div id="legend-op">運算<span class="sw" style="background:#fbbf24"></span>有訓練參數<span class="sw" style="background:#2dd4a7"></span>純計算,沒有參數<span class="sw" style="background:#94a3b8"></span>只是搬運</div>
  <div id="legend-val">方塊高度 = 數值大小<span class="sw" style="background:#3ec7de"></span>正值<span class="sw" style="background:#d98a3d"></span>負值 · 色調隨階段演進</div>
</div>

<script type="module">
import * as THREE from 'three';

// 觸控裝置沒有鍵盤,HUD 提示要改講手勢(和 CSS 的 .k-touch 用同一條判斷)
const TOUCH = matchMedia('(hover: none) and (pointer: coarse)').matches;

/* ================= 基礎場景 ================= */
const BG = 0x05070f;
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 160, 560);

// 直式螢幕(手機)是另一種取景:場景本來是橫向鋪開的,照桌機參數會被左右切掉
const PORTRAIT = innerWidth / innerHeight < 1.05;
// 直式的版面不是「把橫式縮小」,而是改成上下疊:記憶櫃移到正上方、頭 2–4 移到下方,
// 才用得到直式螢幕的高度,也避免兩個大標籤在螢幕上擠在一起
const KV_OFF = PORTRAIT ? new THREE.Vector3(30, 52, 0) : new THREE.Vector3(58, 24, 0);
const P_SPREAD = PORTRAIT ? 0.5 : 1;    // 殘差分身等橫向偏移收窄
const P_CAM = PORTRAIT ? 1.2 : 1;       // 相機再退遠一點
const P_TXT = PORTRAIT ? 0.132 : 0.11;  // 退遠了字要放大才讀得到

const BASE_FOV = 46, DESIGN_ASPECT = 16 / 9, MAX_FOV = 70;
const camera = new THREE.PerspectiveCamera(BASE_FOV, innerWidth / innerHeight, 0.1, 1200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById('app').appendChild(renderer.domElement);
// 窄螢幕時把垂直 fov 撐開,盡量保住水平視野(有上限,免得透視變形太誇張)
function applyCamProjection() {
  camera.aspect = innerWidth / innerHeight;
  if (camera.aspect < DESIGN_ASPECT) {
    const hHalf = Math.atan(Math.tan(BASE_FOV * Math.PI / 360) * DESIGN_ASPECT);
    const v = 2 * Math.atan(Math.tan(hHalf) / camera.aspect) * 180 / Math.PI;
    camera.fov = Math.min(MAX_FOV, v);
  } else camera.fov = BASE_FOV;
  camera.updateProjectionMatrix();
}
applyCamProjection();
addEventListener('resize', () => {
  applyCamProjection();
  renderer.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.AmbientLight(0x8899cc, 0.55));
const hemi = new THREE.HemisphereLight(0x8fb0ff, 0x120a1e, 0.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.25);
sun.position.set(60, 120, 40);
scene.add(sun);
const flashLight = new THREE.PointLight(0xffffff, 0, 140, 1.8);
scene.add(flashLight);

window.__scene = scene; // debug 用鉤子(headless 檢查場景)
const staticG = new THREE.Group();   // 軌道、關卡:建一次,永遠存在
const dynamicG = new THREE.Group();  // 主角、幽靈、粒子、光束:reset 時清除
scene.add(staticG, dynamicG);

/* ================= 45° 軌道 ================= */
// 軌道方向 (0,-1,1) 正規化:從遠處高點以 45° 俯角滑向近處低點
const DIR = new THREE.Vector3(0, -1, 1).normalize();
const ORIGIN = new THREE.Vector3(0, 150, -190);
function pathPos(s, out = new THREE.Vector3()) {
  return out.copy(ORIGIN).addScaledVector(DIR, s);
}

// 關卡的路徑座標
const S = {
  START: -70, ID: 36, WTE: 72, MERGE: 100, RMS: 150,
  FORK1: 164, PRE1: 176, ATTN: 210, WO: 234, JOIN1: 250,
  FORK2: 262, PRE2: 272, MLP: 292, RELU: 312, SQUEEZE: 330, JOIN2: 346,
  WALL: 378
};

/* ================= 小工具 ================= */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const easeIO = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(42);
const gauss = () => {
  let u = 0, v = 0;
  while (u === 0) u = rng();
  while (v === 0) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
};

/* ---- tween 引擎(promise-based,支援快轉 timeScale)---- */
const tweens = new Set();
let timeScale = 1;
function tween(dur, update, ease = easeIO) {
  return new Promise(res => tweens.add({ t: 0, dur, update, ease, res }));
}
const wait = ms => tween(ms, () => {}, k => k);
function stepTweens(dt) {
  for (const tw of [...tweens]) {
    tw.t += dt * 1000 * timeScale;
    const k = clamp(tw.t / tw.dur, 0, 1);
    tw.update(tw.ease(k), k);
    if (k >= 1) { tweens.delete(tw); tw.res(); }
  }
}

/* ---- 文字 sprite(支援中文)---- */
function textSprite(text, { fs = 56, color = '#dbe6ff', bg = true, scale = P_TXT, onTop = false } = {}) {
  const pad = 26;
  const c = document.createElement('canvas');
  let ctx = c.getContext('2d');
  const font = `600 ${fs}px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif`;
  ctx.font = font;
  c.width = Math.ceil(ctx.measureText(text).width) + pad * 2;
  c.height = fs + pad * 2;
  ctx = c.getContext('2d');
  ctx.font = font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (bg) {
    ctx.fillStyle = 'rgba(8,13,28,0.72)';
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    roundRect(ctx, 4, 4, c.width - 8, c.height - 8, 18);
    ctx.fill(); ctx.globalAlpha = 0.55; ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.shadowColor = color;
  ctx.shadowBlur = 16;
  ctx.fillStyle = color;
  ctx.fillText(text, c.width / 2, c.height / 2 + 2);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthWrite: false, depthTest: !onTop
  }));
  spr.scale.set(c.width * scale, c.height * scale, 1);
  spr.renderOrder = onTop ? 8 : 5;
  return spr;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---- 字母/數字方塊貼圖 ---- */
function glyphTexture(glyph, c1, c2, fg) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 256, 256);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 10;
  roundRect(ctx, 8, 8, 240, 240, 26);
  ctx.stroke();
  ctx.font = `700 ${glyph.length > 1 ? 115 : 150}px ui-monospace, Menlo, monospace`; // 兩位數 ID 要縮字才不會頂到邊
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = fg;
  ctx.shadowBlur = 24;
  ctx.fillStyle = fg;
  ctx.fillText(glyph, 128, 140);
  return new THREE.CanvasTexture(c);
}
function glyphCube(glyph, c1, c2, fg, size = 8) {
  const tex = glyphTexture(glyph, c1, c2, fg);
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(size, size, size),
    new THREE.MeshStandardMaterial({
      map: tex, roughness: 0.35, metalness: 0.25,
      emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.5
    })
  );
  const grp = new THREE.Group();
  grp.add(mesh);
  grp.userData.spinMesh = mesh;
  return grp;
}

/* ---- 數值條(16 / 64 連方塊)---- */
const HEAD_COLORS = ['#f472b6', '#a78bfa', '#60a5fa', '#34d399'];
function valColor(v, hue = 0) {
  const h = (v >= 0 ? 0.52 : 0.055) + hue; // 正=青,負=橘;hue=各階段的色相偏移
  return new THREE.Color().setHSL(h % 1, 0.85, clamp(0.3 + Math.abs(v) * 0.16, 0.25, 0.72));
}
function valScaleY(v) { return clamp(0.4 + Math.abs(v) * 0.85, 0.4, 4.2); }
function valScaleXZ(v) { return clamp(0.78 + Math.abs(v) * 0.16, 0.78, 1.32); } // 值大→變壯

function makeStrip(vals, { cube = 3, pitch = 3.9, opacity = 1, hue = 0 } = {}) {
  const grp = new THREE.Group();
  const n = vals.length;
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(cube, cube, cube),
      new THREE.MeshStandardMaterial({
        color: valColor(vals[i], hue), roughness: 0.3, metalness: 0.3,
        transparent: opacity < 1, opacity,
        emissive: valColor(vals[i], hue), emissiveIntensity: 0.25
      })
    );
    m.position.x = (i - (n - 1) / 2) * pitch;
    m.scale.y = valScaleY(vals[i]);
    m.scale.x = m.scale.z = valScaleXZ(vals[i]);
    m.userData.v = vals[i];
    grp.add(m);
  }
  grp.userData.vals = vals.slice();
  grp.userData.pitch = pitch;
  grp.userData.hue = hue;
  grp.userData.cubes = grp.children.slice(); // 之後可能再掛標籤 sprite,數值操作只碰 cubes
  return grp;
}
function setStripValues(strip, vals, k = 1, hueTarget) {
  // k=1 → 完全套用;k<1 → 從舊值往新值內插(供 tween 用);hueTarget → 同時轉移階段色相
  const hue0 = strip.userData.hue || 0;
  const hue1 = hueTarget !== undefined ? hueTarget : hue0;
  strip.userData.cubes.forEach((m, i) => {
    if (i >= vals.length) return;
    const v0 = m.userData.v, v1 = vals[i];
    const v = v0 + (v1 - v0) * k;
    const h = hue0 + (hue1 - hue0) * k;
    m.scale.y = valScaleY(v);
    m.scale.x = m.scale.z = valScaleXZ(v);
    m.material.color.copy(valColor(v, h));
    m.material.emissive.copy(valColor(v, h));
    if (k >= 1) m.userData.v = v1;
  });
  if (k >= 1) { strip.userData.vals = vals.slice(); strip.userData.hue = hue1; }
}
// 殘差合併等「資料被改變」的瞬間:全條白熱脈衝
function stripPulse(strip, dur = 550) {
  return tween(dur, k => {
    const p = Math.sin(k * Math.PI);
    strip.userData.cubes.forEach(m => { m.material.emissiveIntensity = 0.25 + p * 1.25; });
  });
}
function tintByHeads(strip) {
  strip.userData.cubes.forEach((m, i) => {
    const c = new THREE.Color(HEAD_COLORS[Math.floor(i / (strip.userData.cubes.length / 4))]);
    m.material.color.copy(c);
    m.material.emissive.copy(c);
    m.material.emissiveIntensity = 0.4;
  });
}

/* ---- 運算色碼:一眼看出這一步有沒有用到訓練出來的知識 ---- */
// 只用在「這一步在做什麼」的訊號:光環本體、光環標籤、該步驟的撞擊火花。
// 「這是哪一份資料」的顏色一律不套:數值方塊的青/橘、HEAD_COLORS、KV Cache 的紫/粉、柱狀圖、抽樣尺、殘差分身。
const OP_LEARNED = 0xfbbf24; // 金:有訓練參數(模型的知識在這裡)
const OP_PURE    = 0x2dd4a7; // 青綠:純計算,沒有參數
const OP_MOVE    = 0x94a3b8; // 灰藍:只是搬運/查表/儲存,沒在算

/* ---- 關卡 ---- */
// 關卡標籤兩條規則:1) 離鏡頭太近淡出(透視放大會擋畫面)
// 2) 只顯示「已通過或即將抵達」的關卡 —— 後面步驟的標籤不提早出現
const fadeLabels = []; // { sprite, s }
// 走過的關卡「整個」暗下去(球體/光環本體,不只標籤):前一動已經不重要了,
// 盲測顯示它們留在原地全亮會一直搶注意力,還會跟當前步驟的東西疊在一起讓人讀不出來
const fadeGates = []; // { s, mats:[{ m, o }] }
const GATE_PAST_MIN = 0.1;
function registerGate(grp, s) {
  const mats = [];
  grp.traverse(o => {
    if (o.isSprite || !o.material) return; // 標籤有自己的淡出規則
    o.material.transparent = true;
    mats.push({ m: o.material, o: o.material.opacity });
  });
  fadeGates.push({ s, mats });
}
let showAllLabels = false; // 終章全景時打開
function gateSphere(label, color, r = 7, s = 0) {
  const grp = new THREE.Group();
  const wire = new THREE.Mesh(
    new THREE.IcosahedronGeometry(r, 1),
    new THREE.MeshBasicMaterial({ color, wireframe: true, transparent: true, opacity: 0.85 })
  );
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(r * 0.62, 20, 20),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.16 })
  );
  grp.add(wire, core);
  const lb = textSprite(label, { color: colToCss(color), fs: 46 });
  lb.position.y = r + 5;
  grp.add(lb);
  fadeLabels.push({ sprite: lb, s });
  grp.userData_label = lb;
  pathPos(s, grp.position);
  grp.userData = { wire, kind: 'sphere', baseR: r };
  staticG.add(grp);
  registerGate(grp, s);
  return grp;
}
function gateRing(label, color, r = 40, s = 0, labelFs = 46) {
  const grp = new THREE.Group();
  const ring = new THREE.Mesh(

/* ---- 粒子爆散 ---- */
const bursts = [];
function burst(pos, color = 0xffffff, count = 70, speed = 26) {
  const geo = new THREE.BufferGeometry();
  const p = new Float32Array(count * 3), vel = [];
  for (let i = 0; i < count; i++) {
    p[i * 3] = pos.x; p[i * 3 + 1] = pos.y; p[i * 3 + 2] = pos.z;
    const d = new THREE.Vector3(gaussFree(), gaussFree(), gaussFree()).normalize()
      .multiplyScalar(speed * (0.35 + Math.random() * 0.85));
    vel.push(d);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const mat = new THREE.PointsMaterial({
    color, size: 1.7, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const pts = new THREE.Points(geo, mat);
  dynamicG.add(pts);
  bursts.push({ pts, vel, life: 0, max: 0.9 });
}
function gaussFree() { return (Math.random() * 2 - 1) + (Math.random() * 2 - 1); }
function stepBursts(dt) {
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    b.life += dt * timeScale;
    const arr = b.pts.geometry.attributes.position.array;
    for (let j = 0; j < b.vel.length; j++) {
      arr[j * 3] += b.vel[j].x * dt * timeScale;
      arr[j * 3 + 1] += (b.vel[j].y - 14 * b.life) * dt * timeScale;
      arr[j * 3 + 2] += b.vel[j].z * dt * timeScale;
    }
    b.pts.geometry.attributes.position.needsUpdate = true;
    b.pts.material.opacity = clamp(1 - b.life / b.max, 0, 1);
    if (b.life >= b.max) {
      dynamicG.remove(b.pts);
      b.pts.geometry.dispose(); b.pts.material.dispose();
      bursts.splice(i, 1);
    }
  }
}

const V = {};
{
  V.tok = Array.from({ length: 16 }, () => gauss() * 0.75);
  V.pos = Array.from({ length: 16 }, () => gauss() * 0.75);
  V.tok[3] += 3.2; V.tok[9] -= 2.9;                 // 讓融合後大小「誇張地」不均
  V.pos[6] += 3.4; V.pos[13] -= 2.7;                // → RMSNorm 後全體明顯壓平才看得出效果
  V.merged = V.tok.map((v, i) => v + V.pos[i]);      // 真實逐元素相加
  const ms = V.merged.reduce((a, b) => a + b * b, 0) / 16;
  const scale = Math.pow(ms + 1e-5, -0.5);
  // RMSNorm 真算後再做視覺壓縮(|v|^0.55),讓「壓回相近大小」一眼可見
  V.normed = V.merged.map(v => {
    const n = v * scale;
    return Math.sign(n) * Math.pow(Math.abs(n), 0.55);
  });
  V.q = V.normed.map(v => v * 0.8 + gauss() * 0.3);
  V.k = V.normed.map(v => v * 0.7 + gauss() * 0.3);
  V.v = V.normed.map(v => v * 0.75 + gauss() * 0.3);
  V.attnCat = V.v.map(v => v * 0.85 + gauss() * 0.2);
  V.attnOut = Array.from({ length: 16 }, () => gauss() * 0.9);
  V.afterRes1 = V.normed.map((v, i) => v + V.attnOut[i]);
  // MLP 前的 pre-norm 這次是「有感」的:殘差相加後尺度亂了,再壓平一次
  const ms2 = V.afterRes1.reduce((a, b) => a + b * b, 0) / 16;
  const sc2 = Math.pow(ms2 + 1e-5, -0.5);
  V.norm2 = V.afterRes1.map(v => {
    const n = v * sc2;
    return Math.sign(n) * Math.pow(Math.abs(n), 0.55);
  });
  V.h64 = Array.from({ length: 64 }, () => gauss() * 0.9);
  V.relu64 = V.h64.map(v => Math.max(0, v));
  V.mlpOut = Array.from({ length: 16 }, () => gauss() * 0.9);
  V.afterRes2 = V.afterRes1.map((v, i) => v + V.mlpOut[i]);
  V.logits = Array.from({ length: 27 }, () => gauss() * 0.8);
  V.logits[12] = 3.3;  // 'm':emma 中 em 之後還是 m(雙 m)
  V.logits[11] = 1.6;  // 'l'
  V.logits[21] = 1.1;  // 'v'
  const T = 0.5;
  const mx = Math.max(...V.logits);
  const ex = V.logits.map(l => Math.exp((l - mx) / T));
  const tot = ex.reduce((a, b) => a + b, 0);
  V.probs = ex.map(e => e / tot);
  V.attnW = [0.22, 0.31, 0.47]; // [BOS, e, m 自己]
}

  const g = makeStrip(fromStrip.userData.vals, { opacity: 0.34, hue: fromStrip.userData.hue || 0 });
  g.children.forEach(m => { m.material.emissiveIntensity = 0.75; });
  ghostLabel = textSprite('殘差 x_residual', { color: '#94a3b8', fs: 32 });
  ghostLabel.position.y = -14; // 掛在分身下方:掛上面會被 Attention(4 頭) 的關卡標籤壓掉字尾
  g.add(ghostLabel);
  dynamicG.add(g);
  return g;
}
function disposeObj(obj) {
  obj.parent && obj.parent.remove(obj);
  obj.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (o.material.map) o.material.map.dispose();
      o.material.dispose();
    }
  });
}

/* ---- 記憶櫃淡化:第四、五關壓到極淡,講到 Attention(第六關)才恢復 ---- */
// steps[0] 是「開場」不算一關,所以第 N 關剛好就是 steps[N]
const KV_DIM_STEPS = new Set([4, 5]);  // 第四關 RMSNorm、第五關 殘差分岔
const KV_DIM_LEVEL = 0.12;
let kvDim = 1, kvDimTarget = 1;
// 每格畫面在 render 前把記憶櫃的 opacity 乘上 kvDim、render 完再還原。
// 不直接改寫材質的「原始」opacity,因為 setRowEmphasis / 第七關存入等處會自己寫 opacity,
// 記住基準值遲早會漂掉;乘完就還原則永遠跟著當下的狀態走。
const kvDimMats = [];
function collectKVDimMats() {
  kvDimMats.length = 0;
  for (const root of kvDimRoots) {
    root.traverse(o => {
      if (!o.material || !o.material.transparent) return;
      // 文字標籤(BOS / e / K / V)是 onTop 的 sprite,不受深度遮擋,在黑底上同樣的
      // opacity 比方塊搶眼得多;要再壓一級才真的退到背景去
      kvDimMats.push({ m: o.material, f: o.material.isSpriteMaterial ? 0.15 : 1 });
    });
  }
}
function renderWithKVDim() {
  if (kvDim > 0.999) { renderer.render(scene, camera); return; }
  collectKVDimMats();
  const saved = kvDimMats.map(e => e.m.opacity);
  kvDimMats.forEach(e => { e.m.opacity *= kvDim * e.f; });
  renderer.render(scene, camera);
  kvDimMats.forEach((e, i) => { e.m.opacity = saved[i]; });
}

function hudProgress() {
  // 「畫面上正在講的那一關」:播放中就是 idx,播完定格則是剛播完的 idx-1
  const shown = playing ? idx : idx - 1;
  kvDimTarget = KV_DIM_STEPS.has(shown) ? KV_DIM_LEVEL : 1;
  // 運算色碼從第一關就要建立;數值圖例等 Embedding 查表(第 3 步)有方塊了才出現
  $('legend').style.display = idx >= 1 ? 'block' : 'none';
  $('legend-val').style.display = idx >= 3 ? '' : 'none';
  if (playing) {
    $('progress').innerHTML = `播放中:<b>${steps[idx].name}</b>(${TOUCH ? '再點一下' : '再按空白鍵'}快轉)`;
    return;
  }
  $('progress').innerHTML = idx >= steps.length
    ? `完 · <b>R</b> 重播 · ${steps.length} / ${steps.length}`
    : `下一關:<b>${steps[idx].name}</b> · ${idx} / ${steps.length}`;
}

/* ---- 共用建構:Q/K/V 三條分身、自己的 K/V 記憶艙、logits/機率柱 ---- */
function makeQKVStrips(scaleIn = 1) {
  const mk = (vals, lift, tag, col) => {
    const s = makeStrip(vals, { opacity: 0.95 });
    tintByHeads(s);
    const lb = textSprite(tag, { color: col, fs: 36, bg: false, onTop: true });
    lb.position.set(-46, 4, 0);
    s.add(lb);
    s.userData.label = lb;
    s.position.copy(pathPos(S.ATTN + 6));
    s.position.y += lift;
    s.scale.setScalar(scaleIn);
    dynamicG.add(s);
    return s;
  };
  return {
    qs: mk(V.q, 14, 'Q(我在找什麼)', '#f9a8d4'),
    ks: mk(V.k, 0, 'K(我是什麼)', '#c4b5fd'),
    vs: mk(V.v, -14, 'V(我要給什麼)', '#93c5fd'),
    beams: [], wlabels: []
  };
}
// 單色上染(同一個頭的小段共用頭色,q/k/v 以亮度區分)
function tintSolid(strip, colorHex, emiss = 0.4) {
  const c = new THREE.Color(colorHex);
  strip.userData.cubes.forEach(m => {
    m.material.color.copy(c);
    m.material.emissive.copy(c);
    m.material.emissiveIntensity = emiss;
  });
}
// 頭 h 的停泊位:頭 1 在主軌道,頭 2–4 在左側工作台
function headHomePos(h) {
  const base = pathPos(S.ATTN + 6);
  if (h === 0) return base;
  // 直式:三個陪襯的頭改排在主軌道下方(記憶櫃佔了上方),橫式維持左側工作台
  return base.add(PORTRAIT
    ? new THREE.Vector3(-34, -32 - (h - 1) * 26, 0)
    : new THREE.Vector3(-78, 38 - (h - 1) * 30, 0));
}
// 一個頭的工作組:q/k/v 三小條(各 4 塊),或算完後的單條輸出
function makeHeadGroup(h, withOut = false) {
  const grp = new THREE.Group();
  const col = HEAD_COLORS[h];
  if (withOut) {
    const out = makeStrip(V.attnCat.slice(h * 4, h * 4 + 4), { cube: 2.6, pitch: 3.3, opacity: 0.98 });
    tintSolid(out, col, 0.55);
    grp.add(out);
    grp.userData.out = out;
  } else {
    const mkPart = (arr, y, emiss, tag) => {
      const s = makeStrip(arr.slice(h * 4, h * 4 + 4), { cube: 2.4, pitch: 3.1, opacity: 0.95 });
      tintSolid(s, col, emiss);
      s.position.y = y;
      if (h === 0) {
        const t = textSprite(tag, { color: colToCss(col), fs: 30, bg: false, onTop: true });
        t.position.set(-11, 0, 0);
        s.add(t);
      }
      grp.add(s);
      return s;
    };
    // 只有 q 在頭裡:K/V 統一放在右側的 KV Cache,由光束去查
    grp.userData.q = mkPart(V.q, 0, 0.65, 'q');
  }
  const lb = textSprite(`頭 ${h + 1}`, { color: colToCss(col), fs: 30, bg: false, onTop: true });
  lb.position.set(0, 13, 0);
  grp.add(lb);
  grp.userData.label = lb;
  grp.position.copy(headHomePos(h));
  if (h > 0) grp.scale.setScalar(0.85);
  dynamicG.add(grp);
  return grp;
}
// 頭算完:q 換成單條輸出
function swapHeadToOut(head, h) {
  const q = head.userData.q;
  if (q) { head.remove(q); disposeObj(q); head.userData.q = null; }
  const out = makeStrip(V.attnCat.slice(h * 4, h * 4 + 4), { cube: 2.6, pitch: 3.3, opacity: 0.98 });
  tintSolid(out, HEAD_COLORS[h], 0.55);
  head.add(out);
  head.userData.out = out;
  return out;
}
// 陪襯用的頭 2–4:壓暗到 a(1 = 主角亮度),讓視線只跟著頭 1 走
const SIDE_HEAD_DIM = 0.32;
function setHeadDim(g, a) {
  const s = g.userData.q || g.userData.out;
  if (s) s.userData.cubes.forEach(m => {
    m.material.transparent = true;
    m.material.opacity = 0.95 * a;
    m.material.emissiveIntensity = 0.65 * a;
  });
  if (g.userData.label) g.userData.label.material.opacity = clamp(a + 0.12, 0, 1);
}
// 三格:BOS、e(過去,紫)與 m 自己(當前,粉)
function attnPodSpecs() {
  return [
    { pod: bosPod, col: '#c084fc', dy: 7 },
    { pod: ePod, col: '#c084fc', dy: 0 },
    { pod: selfPod, col: '#f0abfc', dy: -7 }
  ];
}
// 一格之內某一排的世界座標(pod 是頂層物件,position 即世界座標)
function podRowPos(pod, which) {
  return pod.position.clone().add(new THREE.Vector3(0, which === 'k' ? KV_ROW_DY : -KV_ROW_DY, 0));
}
// 權重數字算完後的落點:離開光束,貼到自己正在放大的那排 V 左側
const WLABEL_HOME = new THREE.Vector3(PORTRAIT ? -34 : -42, -KV_ROW_DY, 0);
const WLABEL_SHRINK = 0.72;
function wlabelHome(pod) { return pod.position.clone().add(WLABEL_HOME); }
// 光束一律打在 K 排:第九關第一拍是 q 跟 k 比對,線接在 K 才讀得出因果
function makeAttnBeams(fromPos, scored = false) {
  const op = scored ? 0.22 : 0.55;
  const beams = [], wlabels = [];
  attnPodSpecs().forEach((p, i) => {
    const to = podRowPos(p.pod, 'k');
    const b = makeBeam(fromPos.clone(), to, V.attnW[i] * 3.4, new THREE.Color(p.col).getHex());
    b.material.opacity = op;
    beams.push(b);
    // 三格上下各差 15,標籤要沿光束拉開;onTop 才不會被記憶櫃的半透明面板擋住
    const w = textSprite(V.attnW[i].toFixed(2), { color: p.col, fs: 40, onTop: true });
    // 拍 2 停在光束中段偏頭側,才不會蓋到記憶櫃裡的 K/V 方塊與行標
    w.userData.onBeam = new THREE.Vector3().lerpVectors(fromPos, to, 0.42).add(new THREE.Vector3(-12, p.dy, 0));
    w.userData.atV = wlabelHome(p.pod);
    w.userData.scale0 = w.scale.clone();
    // scored = 已經算完的定格:數字已經滑到 V 排旁
    w.position.copy(scored ? w.userData.atV : w.userData.onBeam);
    if (scored) w.scale.copy(w.userData.scale0).multiplyScalar(WLABEL_SHRINK);
    dynamicG.add(w);
    wlabels.push(w);
  });
  return { beams, wlabels };
}
// 比對階段 K 放大的幅度、比對完縮回的幅度
const K_HI = 1.5, K_LO = 0.55;
// V 依權重放大不同程度(0.22 / 0.31 / 0.47 → 1.08 / 1.28 / 1.63);刻意誇張,才看得出「數值決定份量」
function vGrowScale(i) { return 0.6 + V.attnW[i] * 2.2; }
function vGrowEmiss(i) { return 0.4 + V.attnW[i] * 1.5; }
// 拍 1:強調 K —— K 排放大發亮,V 排先讓位
function emphasizeK(k) {
  attnPodSpecs().forEach(p => {
    setRowEmphasis(p.pod.userData.k, 1 + (K_HI - 1) * k, 0.4 + 1.0 * k, ROW_BASE.op, p.pod.userData.kT);
    setRowEmphasis(p.pod.userData.v, 1, 0.4 - 0.25 * k, ROW_BASE.op - 0.55 * k, p.pod.userData.vT);
  });
}
// 拍 3a:K 比對完就縮暗退到後面
function settleK(k) {
  attnPodSpecs().forEach(p => {
    setRowEmphasis(p.pod.userData.k, K_HI + (K_LO - K_HI) * k, 1.4 - 1.25 * k,
      ROW_BASE.op - 0.5 * k, p.pod.userData.kT);
  });
}
// 拍 3b:數值把自己那格的 V 撐大,由呼叫端逐格點名
function growV(i, k) {
  const p = attnPodSpecs()[i];
  setRowEmphasis(p.pod.userData.v, 1 + (vGrowScale(i) - 1) * k,
    0.15 + (vGrowEmiss(i) - 0.15) * k, ROW_BASE.op - 0.55 * (1 - k), p.pod.userData.vT);
}
// 算完之後的記憶櫃定格狀態(play 尾段與 final 共用,避免兩邊漂移)
function applyScoredCacheState() {
  attnPodSpecs().forEach((p, i) => {
    setRowEmphasis(p.pod.userData.k, K_LO, 0.15, ROW_BASE.op - 0.5, p.pod.userData.kT);
    setRowEmphasis(p.pod.userData.v, vGrowScale(i), vGrowEmiss(i), ROW_BASE.op, p.pod.userData.vT);
  });
}

let selfPod = null;
let softmaxLabel = null; // softmax 階段取代牆標籤的文字
// 終章:自迴歸回程的虛線弧(從高牆繞回起點)
function makeReturnArc() {
  const curve = new THREE.QuadraticBezierCurve3(
    pathPos(S.WALL - 20).add(new THREE.Vector3(40, 12, 0)),
    pathPos(150).add(new THREE.Vector3(165, 70, 0)),
    pathPos(S.START + 10)
  );
  const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(64));
  const line = new THREE.Line(geo, new THREE.LineDashedMaterial({
    color: 0xf472b6, dashSize: 3, gapSize: 2.6, transparent: true, opacity: 0.65
  }));
  line.computeLineDistances();
  dynamicG.add(line);
  return line;
}
// 把這一格的 K/V 填進記憶櫃第 3 格(仍掛在 dynamicG,resetWorld 才清得掉)
function buildSelfPod() {
  if (selfPod) { disposeObj(selfPod); selfPod = null; } // 冪等:重建定格時不疊加
  const pod = makeKVRows(V.k, V.v);
  const lb = textSprite('m', { fs: 30, color: '#f0abfc', bg: false, onTop: true });
  lb.position.set(-31, 0, 0);
  pod.add(lb);
  pod.position.copy(kvSlot(2));
  kvSlotFrames[2].material.opacity = 0.7;
  dynamicG.add(pod);
  selfPod = pod;
  return pod;
}
// 64 維中間層(可選擇已套用 ReLU 的定格狀態)
function buildStrip64(reluApplied) {
  const s = makeStrip(V.h64, { cube: 1.5, pitch: 2.02, hue: 0.12 });
  if (reluApplied) {
    s.userData.cubes.forEach((m, i) => {
      if (V.h64[i] >= 0) return;
      m.scale.y = 0.12;
      m.material.color.set(0x475569);
      m.material.emissive.copy(m.material.color);
      m.material.emissiveIntensity = 0;
    });
  }
  return s;
}
function barH(logit, k) { return Math.max(0.15, (logit + 2.6) * k); }
function buildBars(vals, hScale, applyHeights, probMode = false) {
  if (bars) { disposeObj(bars); bars = null; }
  if (barLabels) { disposeObj(barLabels); barLabels = null; }
  bars = new THREE.Group();
  barLabels = new THREE.Group();
  const origin = wallCenter.clone().addScaledVector(DIR, -14);
  for (let i = 0; i < 27; i++) {
    const geo = new THREE.BoxGeometry(BAR_W, 1, BAR_W);
    geo.translate(0, 0.5, 0);
    const isM = i === 12;
    const bar = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: probMode ? (isM ? 0xf0abfc : 0x2dd4a7) : (isM ? 0x93c5fd : 0x60a5fa),
      emissive: probMode ? (isM ? 0xf0abfc : 0x2dd4a7) : 0x1e3a5f,
      emissiveIntensity: isM ? 0.55 : 0.3,
      roughness: 0.35, metalness: 0.3
    }));
    bar.position.set((13 - i) * BAR_PITCH, origin.y - 10, origin.z); // 螢幕上 a→z 由左至右
    bar.scale.y = applyHeights ? Math.max(0.15, probMode ? vals[i] : barH(vals[i], hScale)) : 0.01;
    bars.add(bar);
    // onTop:被選中的那根柱子會蓋住自己的字母,盲測聽眾因此分不清是 l 還是 m
    const lb = textSprite(letters[i] || '∅', { color: isM ? '#f0abfc' : '#7d90b8', fs: 34, bg: false, onTop: true });
    // 往鏡頭方向拉出來:字母留在柱子後面時,最高的那根會蓋住自己的字母(l 還是 m 分不出來)
    lb.position.set(bar.position.x, bar.position.y - 3.4, bar.position.z);
    lb.position.addScaledVector(DIR, -9);
    barLabels.add(lb);
  }
  dynamicG.add(bars, barLabels);
}

/* ================= 導覽狀態機 ================= */
function resetWorld() {
  for (const b of bursts) { dynamicG.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); }
  bursts.length = 0;
  tweens.clear();
  [...dynamicG.children].forEach(disposeObj);
  hero = null; ghost = null; bars = null; barLabels = null; selfPod = null; attn = null;
  heroS = S.START; heroLift = 0; ghostLift = 0; ghostSide = 0;
  timeScale = 1; shakeAmp = 0; flashLight.intensity = 0;
  showAllLabels = false;
  softmaxLabel = null;
  kvSlotFrames[2].material.opacity = 0.25; // 記憶櫃第 3 格回到空槽
  resetPodRows(); // bosPod/ePod 掛在 staticG,第九關的 K 縮暗 / V 放大不清會殘留
  if (wallLabel) wallLabel.visible = true;
  setMidGatesVisible(true);
  Object.values(gates).forEach(g => g.userData.wire.scale.setScalar(1));
}
function rebuildTo(n) {
  resetWorld();
  for (let i = 0; i < n; i++) steps[i].final();
  idx = n;
  if (n === 0) {
    $('info').classList.add('hidden');
    setCam(DEFAULT_CAM);
    camFocus.copy(pathPos(S.START));
  } else {
    const st = steps[n - 1];
    hud(`定格:${st.name}`, `${n} / ${steps.length}`,
        TOUCH ? '往上撥繼續,往下拉再往回。' : '按空白鍵繼續,← 再往回。', '');
  }
  hudProgress();
}
async function next() {
  if (playing) { timeScale = 6; $('fastfwd').classList.add('on'); return; }
  if (idx >= steps.length) return;
  $('intro').classList.add('hidden');
  playing = true;
  hudProgress();
  try { await steps[idx].play(); } catch (e) { console.error(e); }
  playing = false;
  timeScale = 1;
  $('fastfwd').classList.remove('on');
  idx++;
  hudProgress();
}
function prev() {
  if (playing || idx <= 0) return;
  rebuildTo(idx - 1);
}

addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.code === 'ArrowLeft') prev();
  else if (e.code === 'KeyR') { if (!playing) { rebuildTo(0); } }
  else if (e.code === 'KeyF') {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  }
});
// 手勢:往上撥 = 下一關、往下拉 = 上一關(方向和瀏覽網頁的捲動一致);
// 左滑 / 右滑同理。位移不到門檻就當成單純輕點,維持「點任意處推進」的舊行為。
// 注意不能直接用 pointerdown 推進,否則手指一碰下去就前進,滑動永遠來不及被判讀。
const SWIPE_MIN = 40;      // px,超過才算滑動
const SWIPE_MAX_MS = 800;  // 太慢的拖曳不算手勢
let gesture = null;
addEventListener('pointerdown', e => {
  gesture = { x: e.clientX, y: e.clientY, t: performance.now() };
});
addEventListener('pointercancel', () => { gesture = null; });
addEventListener('pointerup', e => {
  if (!gesture) return;
  const dx = e.clientX - gesture.x, dy = e.clientY - gesture.y;
  const dt = performance.now() - gesture.t;
  gesture = null;
  const far = Math.max(Math.abs(dx), Math.abs(dy));
  if (far < SWIPE_MIN) { next(); return; }          // 輕點
  if (dt > SWIPE_MAX_MS) return;                     // 慢速拖曳,不當手勢
  const forward = Math.abs(dy) > Math.abs(dx) ? dy < 0 : dx < 0;  // 往上撥 / 往左滑 = 前進
  forward ? next() : prev();
});

// #n 直達某關定格(相機直接就位,不從起點慢慢滑過去)
function snapCam() {
  camOff.copy(camOffTarget);
  if (focusMode === 'fixed') camFocus.copy(focusFixed);
  else if (hero) hero.getWorldPosition(camFocus);
}
if (TOUCH) $('progress').innerHTML = `往上撥開始 · 0 / ${steps.length}`;

const hashStep = parseInt(location.hash.slice(1), 10);
if (hashStep >= 1 && hashStep <= steps.length) { $('intro').classList.add('hidden'); rebuildTo(hashStep); }

/* ================= 主迴圈 ================= */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
const tmpL = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);

  stepTweens(dt);
  stepBursts(dt);

  // 關卡待機動畫
  gates.id.userData.wire.rotation.y += dt * 0.5;
  gates.wte.userData.wire.rotation.y -= dt * 0.4;
  gates.wpe.userData.wire.rotation.y += dt * 0.45;
  gates.rms.userData.wire.rotation.z += dt * 0.3;
  gates.attn.userData.wire.rotation.z -= dt * 0.25;
  gates.mlp.userData.wire.rotation.z += dt * 0.25;
  gates.squeeze.userData.wire.rotation.z -= dt * 0.25;

  // 單一方塊待機自轉
  if (hero && hero.userData.spinMesh) {
    hero.userData.spinMesh.rotation.y += dt * 0.8;
    hero.userData.spinMesh.rotation.x += dt * 0.3;
  }

  // 相機:跟拍 + 平滑 + 震動
  const focusT = focusMode === 'hero' && hero ? hero.getWorldPosition(tmpV) : (focusMode === 'fixed' ? focusFixed : camFocus);
  camFocus.lerp(focusT, 1 - Math.exp(-3 * dt));
  camOff.lerp(camOffTarget, 1 - Math.exp(-2.2 * dt));
  camera.position.copy(camFocus).add(camOff);
  if (shakeAmp > 0.001) {
    camera.position.x += (Math.random() - 0.5) * shakeAmp * 2;
    camera.position.y += (Math.random() - 0.5) * shakeAmp * 2;
    shakeAmp *= Math.exp(-5 * dt);
  }
  camera.lookAt(camFocus);

  // 閃光衰減
  flashLight.intensity *= Math.exp(-6 * dt);

  // 關卡標籤:1) 離鏡頭太近淡出 2) 未來步驟的標籤在主角接近前不出現
  for (const e of fadeLabels) {
    const d = e.sprite.getWorldPosition(tmpL).distanceTo(camera.position);
    const near = clamp((d - 46) / 30, 0, 1);
    const ahead = e.s - heroS;
    const win = showAllLabels ? 1 : clamp(1 - (ahead - 7) / 7, 0, 1);
    // 走遠之後的舊關卡標籤也淡出,避免和當前步驟混淆
    // 收得比以前快:盲測顯示「rmsnorm」淡淡地卡在 KV Cache 面板後面,觀眾會一直想讀它
    const winB = showAllLabels ? 1 : clamp(1 - (-ahead - 14) / 10, 0, 1);
    e.sprite.material.opacity = near * win * winB;
  }
  // 走過的關卡本體也一起暗下去(終章全景例外)
  for (const g of fadeGates) {
    // 終章全景:標籤要全亮,但關卡本體維持半暗,否則大光環會橫切過各關的標籤
    const past = showAllLabels ? 0.28 : clamp(1 - (heroS - g.s - 10) / 16, GATE_PAST_MIN, 1);
    for (const e of g.mats) e.m.opacity = e.o * past;
  }

  kvDim += (kvDimTarget - kvDim) * (1 - Math.exp(-3.5 * dt));
  renderWithKVDim();
});
camFocus.copy(pathPos(S.START));
if (hashStep >= 1 && hashStep <= steps.length) snapCam(); // 直達定格:相機不從起點慢慢滑過去
</script>
</body>
</html>
